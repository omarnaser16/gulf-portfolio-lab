# Runs the full test suite on every push and pull request to main.
# The suite needs no network or API key: tests use synthetic prices and a scripted fake model.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff setuptools  # setuptools: the non-editable install test
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
