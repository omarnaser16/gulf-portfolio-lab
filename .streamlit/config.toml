# Light private-bank theme: off-white page, white cards, deep navy and an azure accent. Charts
# use the matching plotly template in src/gpl/plots.py ("gpl_light"); the app passes
# theme=None so Streamlit doesn't override it. Green/red are kept for gains, losses, pass/fail.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2B2B"
font = "sans serif"
codeFont = "monospace"
borderColor = "#E3E1DA"
showWidgetBorder = true

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
