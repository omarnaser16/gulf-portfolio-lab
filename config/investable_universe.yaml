# Curated investable universe for Optimise › "Build a portfolio for me" and the swap ideas in
# "Improve my current portfolio" (gpl/construct.py). Liquid funds and GCC blue chips, each
# tagged. ILLUSTRATIVE, NOT A BUY LIST: an adviser must check costs, liquidity, share class and
# the client's own Sharia screen before using any of them.
#
# Fields
#   name, asset_class (Equity | Bonds | Sukuk | Gold | Cash | Real estate), region,
#   currency (trading currency), sharia (compliant | not_compliant | unknown: compliant only when
#   screened by the fund's index provider or Sharia board), domicile, factor (low_vol |
#   momentum | quality, for the tilts), ucits_of (the US-listed fund it replaces),
#   gcc_stock (single GCC stocks: in the universe only when the IPS asks for GCC exposure),
#   history_from / verified: first price date on Yahoo and the date that was checked
#   (written by scripts/verify_universe.py; blank until verified).
#
# Survivorship bias: these are funds that exist today; a backtest over them cannot include
# funds that closed. Stated wherever results are shown.

