# Default investable universe and project-wide defaults.
# US-listed ETFs: one trading calendar, priced in USD, clean Yahoo Finance history.

groups:
  gcc_equity: [KSA, UAE, QAT]      # iShares MSCI country ETFs; history starts ~2014-15
  global_equity: [SPY, EFA, EEM]   # US, developed ex-US, emerging
  bonds: [AGG, TLT]                # aggregate, long Treasuries
  real_assets: [GLD]               # gold

# Downloaded but never held in a portfolio.
non_assets:
  risk_free: "^IRX"                # 13-week T-bill yield, quoted in percent
  volatility: "^VIX"               # regime feature (Week 2)

benchmarks:
  sixty_forty: { SPY: 0.60, AGG: 0.40 }
  spy: { SPY: 1.00 }

defaults:
  start: "2015-01-01"
  end: "2026-09-30"                # fixed (inclusive) so results are reproducible
  periods_per_year: 252
  risk_free_fallback: 0.0          # annual rate used if ^IRX is unavailable
  max_weight: 0.40
  cost_bps: 10
  rebalance: "ME"                  # month end
  lookback: 252                    # trading days in the estimation window
  var_level: 0.95
  max_ffill: 5

# Regime classifier (Week 2). Uses SPY, AGG and ^VIX only, so it can start well before the
# GCC ETFs exist and learn from 2008, 2011, 2015, 2018, 2020 and 2022.
regime:
  start: "2005-01-01"
  equity: SPY
  bond: AGG
  horizon: 21                      # label = next month's realised volatility
  quantile: 0.80                   # stressed = above the 80th percentile of the past year
  window: 252
  model: logistic                  # logistic | random_forest
  refit: "ME"                      # walk-forward refit each month end
  min_train: 504                   # two years before the first prediction
  threshold: 0.5                   # P(stressed) at which the strategy de-risks

# Monte Carlo (dashboard defaults)
montecarlo:
  method: block_bootstrap          # block_bootstrap | bootstrap | gbm
  block_size: 21                   # trading days per block (about a month)
  inflation: 0.025                 # fixed annual inflation for the "real terms" toggle

# AI analyst (Week 3). The model ID lives here, not in code.
agent:
  model: claude-haiku-5-5          # cheap default; switch to a larger model for richer memos
  max_tokens: 16000
  effort: medium                   # low | medium | high
  max_tool_rounds: 8               # safety limit on tool round-trips per question
  price_per_mtok: { input: 0.10, output: 0.50 }   # for the cost estimate shown in the app

# Dashboard quick picks (any Yahoo Finance ticker can also be typed in).
# Abu Dhabi (ADX) listings such as FAB are not available on Yahoo Finance.
presets:
  Default ETFs: [KSA, UAE, QAT, SPY, EFA, EEM, AGG, TLT, GLD]
  GCC stocks: ["2222.SR", "1120.SR", "EMAAR.AE", "EMIRATESNBD.AE", "QNBK.QA", "NBK.KW"]
  Global ETFs: [SPY, EFA, EEM, AGG, TLT, GLD]
ticker_names:
  "2222.SR": Saudi Aramco
  "1120.SR": Al Rajhi Bank
  "EMAAR.AE": Emaar Properties
  "EMIRATESNBD.AE": Emirates NBD
  "QNBK.QA": Qatar National Bank
  "NBK.KW": National Bank of Kuwait

# Benchmarks for the Portfolio tab: total-return proxies (adjusted prices include dividends),
# converted to USD like any other asset. "Any loaded asset" is added in the app.
benchmark_choices:
  "60/40 (SPY/AGG)":
    weights: { SPY: 0.60, AGG: 0.40 }
    represents: "60% US large-cap stocks (SPY) and 40% US investment-grade bonds (AGG), rebalanced daily."
  "S&P 500 (SPY)":
    weights: { SPY: 1.00 }
    represents: "US large-cap stocks: SPDR S&P 500 ETF, dividends reinvested."
  "FTSE 100 (ISF.L)":
    weights: { "ISF.L": 1.00 }
    represents: "UK large-cap stocks: iShares Core FTSE 100 ETF, quoted in pence in London and converted to USD."
  "MSCI World (URTH)":
    weights: { URTH: 1.00 }
    represents: "Developed-market stocks worldwide: iShares MSCI World ETF."
  "Saudi market (KSA)":
    weights: { KSA: 1.00 }
    represents: "Saudi stocks: iShares MSCI Saudi Arabia ETF (US-listed, in USD)."
  "UAE market (UAE)":
    weights: { UAE: 1.00 }
    represents: "UAE stocks: iShares MSCI UAE ETF (US-listed, in USD)."
  "Cash (13-week T-bills)":
    cash: true
    represents: "13-week US Treasury bills (^IRX), the same rate used for Sharpe ratios; no fund fees."

# Optimise tab: candidate methods judged walk-forward, after costs (see gpl/recommend.py).
optimise_lab:
  cluster_threshold: 0.70          # holdings with average correlation >= this form a cluster
  volatility_tolerance: 0.005      # 0.50 pp: "about the same" / "on target" volatility
  held_up_ratio: 0.50              # keeps >= 50% of its in-sample Sharpe out of sample

# Historical stress episodes (Analyst stress test). Returns run from the close on `start` to the
# close on `end`.
stress_episodes:
  - name: COVID crash
    start: "2020-02-19"
    end: "2020-03-23"
    description: "S&P 500 peak to trough as the pandemic spread (19 Feb - 23 Mar 2020)."
  - name: 2020 oil crash
    start: "2020-03-06"
    end: "2020-04-21"
    description: "OPEC+ talks collapse to US oil (WTI) trading below zero (6 Mar - 21 Apr 2020)."
  - name: 2022 rate shock
    start: "2022-01-03"
    end: "2022-10-12"
    description: "S&P 500 2022 peak to trough as the Fed raised rates fast (3 Jan - 12 Oct 2022)."

# Region and asset type for known tickers (others: exchange suffix and holding group).
exposure_meta:
  SPY: { region: United States, asset_type: Equity }
  EFA: { region: Developed ex-US, asset_type: Equity }
  EEM: { region: Emerging markets, asset_type: Equity }
  URTH: { region: World (developed), asset_type: Equity }
  KSA: { region: Saudi Arabia, asset_type: Equity }
  UAE: { region: UAE, asset_type: Equity }
  QAT: { region: Qatar, asset_type: Equity }
  AGG: { region: United States, asset_type: Bonds }
  TLT: { region: United States, asset_type: Bonds }
  GLD: { region: Global, asset_type: Gold / commodities }
  "ISF.L": { region: United Kingdom, asset_type: Equity }
