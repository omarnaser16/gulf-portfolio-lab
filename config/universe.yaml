# Default investable universe and project-wide defaults.
# US-listed ETFs: one trading calendar, priced in USD, clean Yahoo Finance history.

groups:
  gcc_equity: [KSA, UAE, QAT]      # iShares MSCI country ETFs; history starts ~2014-15
  global_equity: [SPY, EFA, EEM]   # US, developed ex-US, emerging
  bonds: [AGG, TLT]                # aggregate, long Treasuries
  real_assets: [GLD]               # gold

# Downloaded but never held in a portfolio.
non_assets:
  risk_free: "^IRX"                # 13-week T-bill yield, quoted in percent
  volatility: "^VIX"               # regime feature (Week 2)

benchmarks:
  sixty_forty: { SPY: 0.60, AGG: 0.40 }
  spy: { SPY: 1.00 }

defaults:
  start: "2015-01-01"
  end: "2026-09-30"                # fixed (inclusive) so results are reproducible
  periods_per_year: 252
  risk_free_fallback: 0.0          # annual rate used if ^IRX is unavailable
  max_weight: 0.40
  cost_bps: 10
  rebalance: "ME"                  # month end
  lookback: 252                    # trading days in the estimation window
  var_level: 0.95
  max_ffill: 5

# Regime classifier (Week 2). Uses SPY, AGG and ^VIX only, so it can start well before the
# GCC ETFs exist and learn from 2008, 2011, 2015, 2018, 2020 and 2022.
regime:
  start: "2005-01-01"
  equity: SPY
  bond: AGG
  horizon: 21                      # label = next month's realised volatility
  quantile: 0.80                   # stressed = above the 80th percentile of the past year
  window: 252
  model: logistic                  # logistic | random_forest
  refit: "ME"                      # walk-forward refit each month end
  min_train: 504                   # two years before the first prediction
  threshold: 0.5                   # P(stressed) at which the strategy de-risks

# Monte Carlo (dashboard defaults)
montecarlo:
  method: block_bootstrap          # block_bootstrap | bootstrap | gbm
  block_size: 21                   # trading days per block (about a month)
  inflation: 0.025                 # fixed annual inflation for the "real terms" toggle

# AI analyst (Week 3). The model ID lives here, not in code.
agent:
  model: claude-haiku-5-5          # cheap default; switch to a larger model for richer memos
  max_tokens: 16000
  effort: medium                   # low | medium | high
  max_tool_rounds: 8               # safety limit on tool round-trips per question
  price_per_mtok: { input: 0.10, output: 0.50 }   # for the cost estimate shown in the app

# Dashboard quick picks (any Yahoo Finance ticker can also be typed in).
# Abu Dhabi (ADX) listings such as FAB are not available on Yahoo Finance.
presets:
  Default ETFs: [KSA, UAE, QAT, SPY, EFA, EEM, AGG, TLT, GLD]
  GCC stocks: ["2222.SR", "1120.SR", "EMAAR.AE", "EMIRATESNBD.AE", "QNBK.QA", "NBK.KW"]
  Global ETFs: [SPY, EFA, EEM, AGG, TLT, GLD]
ticker_names:
  "2222.SR": Saudi Aramco
  "1120.SR": Al Rajhi Bank
  "EMAAR.AE": Emaar Properties
  "EMIRATESNBD.AE": Emirates NBD
  "QNBK.QA": Qatar National Bank
  "NBK.KW": National Bank of Kuwait

# Benchmarks for the Portfolio tab: total-return proxies (adjusted prices include dividends),
# converted to USD like any other asset. "Any loaded asset" is added in the app.
benchmark_choices:
  "60/40 (SPY/AGG)":
    weights: { SPY: 0.60, AGG: 0.40 }
    represents: "60% US large-cap stocks (SPY) and 40% US investment-grade bonds (AGG), rebalanced daily."
  "S&P 500 (SPY)":
    weights: { SPY: 1.00 }
    represents: "US large-cap stocks: SPDR S&P 500 ETF, dividends reinvested."
  "FTSE 100 (ISF.L)":
    weights: { "ISF.L": 1.00 }
    represents: "UK large-cap stocks: iShares Core FTSE 100 ETF, quoted in pence in London and converted to USD."
  "MSCI World (URTH)":
    weights: { URTH: 1.00 }
    represents: "Developed-market stocks worldwide: iShares MSCI World ETF."
  "Saudi market (KSA)":
    weights: { KSA: 1.00 }
    represents: "Saudi stocks: iShares MSCI Saudi Arabia ETF (US-listed, in USD)."
  "UAE market (UAE)":
    weights: { UAE: 1.00 }
    represents: "UAE stocks: iShares MSCI UAE ETF (US-listed, in USD)."
  "Sharia 60/40 (SPUS/SPSK)":
    weights: { SPUS: 0.60, SPSK: 0.40 }
    represents: "60% Sharia-screened US stocks (SPUS) and 40% global sukuk (SPSK), rebalanced daily. History starts in Dec 2019, so comparisons are shorter."
  "Cash (13-week T-bills)":
    cash: true
    represents: "13-week US Treasury bills (^IRX), the same rate used for Sharpe ratios; no fund fees."

# Optimise tab: candidate methods judged walk-forward, after costs (see gpl/recommend.py).
optimise_lab:
  cluster_threshold: 0.70          # holdings with average correlation >= this form a cluster
  volatility_tolerance: 0.005      # 0.50 pp: "about the same" / "on target" volatility
  held_up_ratio: 0.50              # keeps >= 50% of its in-sample Sharpe out of sample
  min_sharpe_gain: 0.05            # a change must beat the current Sharpe by this much
  # "Build a portfolio for me" and "Improve my current portfolio" (gpl/construct.py)
  tracking_error_max: 0.04         # build: at most 4% a year away from the benchmark
  build_min_information_ratio: 0.10  # build: "beats the benchmark" needs IR >= 0.10 (else noise)
  build_holdings: [8, 15]          # build: 8-15 holdings
  build_min_weight: 0.02           # build: each holding at least 2%
  tilt_min: 0.25                   # build: at least 25% in a tilt's top-scored names
  build_min_history_years: 10      # build: securities with 10+ years of prices
  build_min_history_years_sharia: 6  # Sharia funds start 2019: shorter, and labelled
  build_max_turnover: 0.25        # build: at most 25% traded per quarter after the first build
  build_rebalance: QE              # build: securities re-chosen each quarter (monthly is ~2x slower)
  max_turnover: 0.30               # improve: at most 30% of the portfolio traded
  max_swaps: 3                     # improve: at most 3 swaps

# Historical stress episodes (Analyst stress test). Returns run from the close on `start` to the
# close on `end`.
# Trading costs by market (bps of the amount traded: commission + spread + impact). JUDGEMENT
# ESTIMATES, not quotes: GCC and other local exchanges cost more to trade than US-listed ETFs.
# Holdings without a listed suffix (US listings, incl. US-listed GCC ETFs) use the
# ⚙ Settings cost (default 10 bps).
trading_costs:
  by_suffix:
    ".SR": 30      # Tadawul (Saudi)
    ".AE": 35      # DFM (Dubai)
    ".AD": 35      # ADX (Abu Dhabi)
    ".QA": 30      # Qatar Stock Exchange
    ".KW": 35      # Boursa Kuwait
    ".BH": 40      # Bahrain Bourse
    ".OM": 40      # Muscat (MSX)
    ".L": 15       # London

# Cash needs due within this many months must already be held in cash-like holdings: cash,
# short-term bonds or sukuk (a hard optimiser limit). Later needs are recorded, not enforced.
cash_need_window_months: 36
# Funds that count as cash-like (verified on Yahoo, Oct 2026). Any holding in the
# "Cash & short-term" group, or with annual volatility <= 3%, also counts.
cash_like:
  - BIL       # SPDR Bloomberg 1-3 Month T-Bill ETF
  - SHV       # iShares 0-1 Year Treasury Bond ETF
  - SGOV      # iShares 0-3 Month Treasury Bond ETF
  - SHY       # iShares 1-3 Year Treasury Bond ETF
  - VGSH      # Vanguard Short-Term Treasury ETF
  - IB01.L    # iShares $ Treasury Bond 0-1yr UCITS ETF (Ireland, USD)
  - SPSK      # SP Funds Dow Jones Global Sukuk ETF (sukuk; ~6% volatility, listed by name)

stress_episodes:
  - name: COVID crash
    start: "2020-02-19"
    end: "2020-03-23"
    description: "S&P 500 peak to trough as the pandemic spread (19 Feb - 23 Mar 2020)."
  - name: 2020 oil crash
    start: "2020-03-06"
    end: "2020-04-21"
    description: "OPEC+ talks collapse to US oil (WTI) trading below zero (6 Mar - 21 Apr 2020)."
  - name: 2022 rate shock
    start: "2022-01-03"
    end: "2022-10-12"
    description: "S&P 500 2022 peak to trough as the Fed raised rates fast (3 Jan - 12 Oct 2022)."

# Region and asset type for known tickers (others: exchange suffix and holding group).
exposure_meta:
  SPY: { region: United States, asset_type: Equity }
  EFA: { region: Developed ex-US, asset_type: Equity }
  EEM: { region: Emerging markets, asset_type: Equity }
  URTH: { region: World (developed), asset_type: Equity }
  KSA: { region: Saudi Arabia, asset_type: Equity }
  UAE: { region: UAE, asset_type: Equity }
  QAT: { region: Qatar, asset_type: Equity }
  AGG: { region: United States, asset_type: Bonds }
  TLT: { region: United States, asset_type: Bonds }
  GLD: { region: Global, asset_type: Gold / commodities }
  SPUS: { region: United States, asset_type: Equity }
  HLAL: { region: United States, asset_type: Equity }
  SPSK: { region: Global, asset_type: Sukuk }
  BIL: { region: United States, asset_type: Cash / T-bills }
  "ISF.L": { region: United Kingdom, asset_type: Equity }

# Risk bands from the client risk score (gpl/client.py). Judgement defaults the adviser can
# override per client; fractions. A more cautious client gets a lower cap on any one holding.
risk_bands:
  1: { max_volatility: 0.06, max_drawdown: 0.10, max_weight: 0.20 }
  2: { max_volatility: 0.09, max_drawdown: 0.15, max_weight: 0.25 }
  3: { max_volatility: 0.12, max_drawdown: 0.20, max_weight: 0.30 }
  4: { max_volatility: 0.16, max_drawdown: 0.30, max_weight: 0.35 }
  5: { max_volatility: 0.20, max_drawdown: 0.40, max_weight: 0.40 }

# Sharia status (compliant | not_compliant; anything else is unknown) and sector for known
# tickers. Partial and illustrative: an adviser must confirm with the client's Sharia screen.
security_attributes:
  SPY: { sharia: not_compliant, sector: Broad US equity }
  EFA: { sharia: not_compliant, sector: Broad developed equity }
  EEM: { sharia: not_compliant, sector: Broad emerging equity }
  URTH: { sharia: not_compliant, sector: Broad world equity }
  KSA: { sharia: not_compliant, sector: Broad Saudi equity }
  UAE: { sharia: not_compliant, sector: Broad UAE equity }
  QAT: { sharia: not_compliant, sector: Broad Qatar equity }
  AGG: { sharia: not_compliant, sector: Conventional bonds }
  TLT: { sharia: not_compliant, sector: Conventional bonds }
  GLD: { sharia: unknown, sector: Gold }
  # Curated Sharia-compliant funds (each screened by its index provider / Sharia board;
  # verified on Yahoo Oct 2026). A fund is never treated as compliant from its name alone.
  SPUS: { sharia: compliant, sector: Sharia US equity }
  HLAL: { sharia: compliant, sector: Sharia US equity }
  SPSK: { sharia: compliant, sector: Sukuk }
  SPRE: { sharia: compliant, sector: Sharia global REITs }
  UMMA: { sharia: compliant, sector: Sharia world equity }
  "ISDU.L": { sharia: compliant, sector: Sharia US equity }
  "ISWD.L": { sharia: compliant, sector: Sharia world equity }
  "ISDE.L": { sharia: compliant, sector: Sharia emerging equity }
  "1120.SR": { sharia: compliant, sector: Financial Services }
  "2222.SR": { sharia: compliant, sector: Energy }

# GCC domicile check (gpl/domicile.py). INFORMATION, NOT TAX ADVICE: rates and thresholds as of
# 2026 for non-US persons; confirm with a tax adviser.
domicile:
  rates_as_of: "2026"
  us_estate_exemption_usd: 60000       # non-resident, non-citizen exemption on US-situs assets
  nra_unified_credit_usd: 13000        # the credit equivalent to the 60,000 exemption
  withholding_us_fund_non_us_person: 0.30   # on dividends from US-domiciled funds/stocks
  withholding_irish_fund_us_dividends: 0.15 # paid at fund level by Irish funds (US-Ireland treaty)
  overrides: {}                        # ticker -> "US" or another domicile, if listing misleads

# Irish-domiciled alternatives to US-listed funds, each verified on Yahoo Finance (Oct 2026).
# Not a recommendation: check costs, liquidity, tracking and share class before switching.
ucits_equivalents:
  SPY: { ticker: CSPX.L, name: "iShares Core S&P 500 UCITS ETF USD (Acc)", domicile: Ireland, match: "same index (S&P 500)" }
  AGG: { ticker: IUAA.L, name: "iShares US Aggregate Bond UCITS ETF USD (Acc)", domicile: Ireland, match: "same index (US aggregate bonds)" }
  GLD: { ticker: IGLN.L, name: "iShares Physical Gold ETC", domicile: Ireland, match: "physical gold; an ETC, not a UCITS fund" }
  URTH: { ticker: SWDA.L, name: "iShares Core MSCI World UCITS ETF USD (Acc)", domicile: Ireland, match: "same index (MSCI World)" }
  EEM: { ticker: IEEM.L, name: "iShares MSCI EM UCITS ETF USD (Dist)", domicile: Ireland, match: "same index (MSCI Emerging Markets)" }
  TLT: { ticker: IDTL.L, name: "iShares $ Treasury Bond 20+yr UCITS ETF USD (Dist)", domicile: Ireland, match: "same exposure (US Treasuries 20+ years)" }
  KSA: { ticker: IKSA.L, name: "iShares MSCI Saudi Arabia Capped UCITS ETF USD (Acc)", domicile: Ireland, match: "similar exposure, different index (capped)" }
