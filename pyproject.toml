[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gulf-portfolio-lab"
version = "0.1.0"
description = "An AI-agent portfolio analyst for GCC and global investors."
readme = "BRIEF.md"
requires-python = ">=3.14"
authors = [{ name = "Omar Naser" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "yfinance==1.7.0",  # unofficial API: pinned, bump deliberately
    "pyarrow",
    "pyyaml",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: test hits the real network (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
